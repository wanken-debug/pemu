name: switch-release

on:
  workflow_dispatch:

jobs:
  build-switch-release:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Apply libcross2d dual stick files
        run: |
          cp -v $GITHUB_WORKSPACE/patches/libcross2d/include/cross2d/skeleton/input.h \
                $GITHUB_WORKSPACE/external/libcross2d/include/cross2d/skeleton/input.h
          cp -v $GITHUB_WORKSPACE/patches/libcross2d/source/skeleton/input.cpp \
                $GITHUB_WORKSPACE/external/libcross2d/source/skeleton/input.cpp
          echo "--- verify ---"
          grep -n rightStickToButtons $GITHUB_WORKSPACE/external/libcross2d/include/cross2d/skeleton/input.h
          grep -n rightStickToButtons $GITHUB_WORKSPACE/external/libcross2d/source/skeleton/input.cpp

      - name: Configure
        run: |
          cd $GITHUB_WORKSPACE
          mkdir -p cmake-build && cd cmake-build
          cmake -G "Unix Makefiles" -DPLATFORM_SWITCH=ON -DCMAKE_BUILD_TYPE=Release ..

      - name: Build pfbneo
        run: |
          cd $GITHUB_WORKSPACE/cmake-build
          make pfbneo.deps
          make -j4 pfbneo.nro
          cp src/cores/pfbneo/pfbneo.nro $GITHUB_WORKSPACE/pfbneo.nro
          ls -la $GITHUB_WORKSPACE/pfbneo.nro

      - name: Upload nro
        uses: actions/upload-artifact@v4
        with:
          name: pfbneo-dualstick-nro
          path: pfbneo.nro
          if-no-files-found: error