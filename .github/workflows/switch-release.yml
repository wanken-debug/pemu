name: switch-release

on:
  workflow_dispatch:

jobs:
  build-switch-release:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Apply libcross2d dual stick patch
        run: |
          cd $GITHUB_WORKSPACE/external/libcross2d
          git apply $GITHUB_WORKSPACE/patches/0001-libcross2d-dualstick.patch
          echo "libcross2d patched:"
          grep -n rightStickToButtons source/skeleton/input.cpp include/cross2d/skeleton/input.h

      - name: Configure
        run: |
          cd $GITHUB_WORKSPACE
          mkdir -p cmake-build && cd cmake-build
          cmake -G "Unix Makefiles" -DPLATFORM_SWITCH=ON -DCMAKE_BUILD_TYPE=Release ..

      - name: Build pfbneo
        run: |
          cd $GITHUB_WORKSPACE/cmake-build
          make pfbneo.deps
          make -j4 pfbneo.nro
          cp src/cores/pfbneo/pfbneo.nro $GITHUB_WORKSPACE/pfbneo.nro
          ls -la $GITHUB_WORKSPACE/pfbneo.nro

      - name: Upload nro
        uses: actions/upload-artifact@v4
        with:
          name: pfbneo-dualstick-nro
          path: pfbneo.nro
          if-no-files-found: error
